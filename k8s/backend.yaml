apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: infinance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/infinance-calculator-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: infinance-config
            - secretRef:
                name: infinance-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: infinance
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
