services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/infinance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-infinance}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-infinance-local}
      INFINANCE_JWT_SECRET: ${INFINANCE_JWT_SECRET:-local-only-change-this-secret-32-bytes}
      INFINANCE_ADMIN_USERNAME: ${INFINANCE_ADMIN_USERNAME:-admin}
      INFINANCE_ADMIN_PASSWORD: ${INFINANCE_ADMIN_PASSWORD:-change-me}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: infinance
      MYSQL_USER: ${MYSQL_USER:-infinance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infinance-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  mysql-data:
