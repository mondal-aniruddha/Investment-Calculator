version: '3.9'

services:
  # ── MySQL 8.4 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: infinance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-infinance}
      MYSQL_USER: ${MYSQL_USER:-infinance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infinance}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: infinance-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-infinance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-infinance}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-infinance}
      INFINANCE_JWT_SECRET: ${INFINANCE_JWT_SECRET:-CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_CHARS_MIN}
      INFINANCE_METALS_API_KEY: ${INFINANCE_METALS_API_KEY:-}
      INFINANCE_AI_ENABLED: ${INFINANCE_AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8081,${FRONTEND_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  # ── Vite/React frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: infinance-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      BACKEND_URL: http://backend:8080

volumes:
  mysql_data:
