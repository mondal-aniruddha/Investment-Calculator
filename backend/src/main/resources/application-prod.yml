spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,https://infinance-home.netlify.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

infinance:
  otp:
    provider: ${INFINANCE_OTP_PROVIDER:twilio}
    secret: ${INFINANCE_OTP_SECRET}
    twilio:
      account-sid: ${INFINANCE_TWILIO_ACCOUNT_SID}
      auth-token: ${INFINANCE_TWILIO_AUTH_TOKEN}
      sms-from: ${INFINANCE_TWILIO_SMS_FROM}
      whatsapp-from: ${INFINANCE_TWILIO_WHATSAPP_FROM}
      whatsapp-content-sid: ${INFINANCE_TWILIO_WHATSAPP_CONTENT_SID:}
