spring:
  application:
    name: infinance-calculator-backend
  profiles:
    default: dev
  config:
    import:
      - classpath:application-assumptions.yml

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
  max-http-request-header-size: 16KB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

infinance:
  jwt:
    secret: ${INFINANCE_JWT_SECRET:}
    expiration: ${INFINANCE_JWT_EXPIRATION:86400}
  owner:
    name: ${INFINANCE_OWNER_NAME:Aniruddha Mondal}
    whatsapp: ${INFINANCE_OWNER_WHATSAPP:+91 8013292565}
    email: ${INFINANCE_OWNER_EMAIL:aniruddha0266@gmail.com}
  queries:
    notify-enabled: ${INFINANCE_QUERIES_NOTIFY_ENABLED:false}
    recipient-email: ${INFINANCE_QUERIES_RECIPIENT_EMAIL:aniruddha0266@gmail.com}
