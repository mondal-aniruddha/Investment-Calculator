name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend and scan dependencies
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            mvn --batch-mode clean verify -DnvdApiKey="$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY is not configured; running backend verification without the OWASP dependency scan."
            mvn --batch-mode clean verify -Ddependency-check.skip=true
          fi
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  frontend-and-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
