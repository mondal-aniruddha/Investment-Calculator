apiVersion: v1
kind: Secret
metadata:
  name: infinance-secrets
  namespace: infinance
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: replace-me
  SPRING_DATASOURCE_PASSWORD: replace-me
  MYSQL_ROOT_PASSWORD: replace-me
  INFINANCE_JWT_SECRET: replace-with-at-least-32-random-bytes
  INFINANCE_ADMIN_USERNAME: replace-me
  INFINANCE_ADMIN_PASSWORD: replace-me
  INFINANCE_METALS_PROVIDER: metals-dev
  INFINANCE_METALS_API_KEY: replace-with-metals-dev-api-key
  INFINANCE_METALS_BASE_URL: https://api.metals.dev
  INFINANCE_METALS_AUTHORITY: mcx
  INFINANCE_METALS_BASE_CURRENCY: INR
  INFINANCE_METALS_UNIT: g
  INFINANCE_OWNER_NAME: replace-with-owner-name
  INFINANCE_OWNER_PHONE: replace-with-owner-phone
  INFINANCE_OWNER_EMAIL: replace-with-owner-email
  INFINANCE_QUERIES_NOTIFY_ENABLED: "false"
  INFINANCE_QUERIES_RECIPIENT_EMAIL: replace-with-owner-email
  INFINANCE_OTP_SECRET: replace-with-at-least-32-chars-random-secret
  INFINANCE_TWILIO_ACCOUNT_SID: replace-with-twilio-account-sid
  INFINANCE_TWILIO_AUTH_TOKEN: replace-with-twilio-auth-token
  INFINANCE_TWILIO_SMS_FROM: replace-with-twilio-sms-phone
  INFINANCE_TWILIO_WHATSAPP_FROM: "+14155238886"
  INFINANCE_TWILIO_WHATSAPP_CONTENT_SID: replace-with-whatsapp-content-sid
