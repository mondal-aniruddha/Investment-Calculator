apiVersion: v1
kind: ConfigMap
metadata:
  name: infinance-config
  namespace: infinance
data:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/infinance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  APP_CORS_ALLOWED_ORIGINS: https://calculator.example.com
  INFINANCE_OTP_ENABLED: "true"
  INFINANCE_OTP_PROVIDER: twilio
  INFINANCE_OTP_CODE_LENGTH: "6"
  INFINANCE_OTP_TTL_SECONDS: "300"
  INFINANCE_OTP_MAX_ATTEMPTS: "5"
  INFINANCE_OTP_RESEND_COOLDOWN_SECONDS: "60"
  INFINANCE_OTP_MAX_SENDS_PER_PHONE_PER_HOUR: "5"
  INFINANCE_OTP_ALLOWED_COUNTRY_CODES: "+91"
